name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DiscordRPC-NativeAOT.csproj

      - name: Build
        run: dotnet build DiscordRPC-NativeAOT.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack DiscordRPC-NativeAOT.csproj -c Release --no-build -o ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          if-no-files-found: error
