name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DiscordRPC-NativeAOT.csproj

      - name: Build
        run: dotnet build DiscordRPC-NativeAOT.csproj -c Release --no-restore

      - name: Test
        run: |
          shopt -s nullglob globstar
          projects=(**/*Test.csproj **/*Tests.csproj)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects found; skipping."
          else
            dotnet test "${projects[@]}" -c Release
          fi

      - name: Pack
        run: dotnet pack DiscordRPC-NativeAOT.csproj -c Release --no-build -o ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          if-no-files-found: error

      # Only runs for tags like v1.0.0, and only after the build/test steps above succeed.
      # Creates a DRAFT release. Publishing it is what triggers the NuGet publish workflow.
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" --draft --generate-notes
          fi
